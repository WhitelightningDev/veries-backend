[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "veries-backend"
version = "0.1.0"
description = "Veries backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.4",
]
gcp = [
  "google-cloud-bigquery>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veries_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/veries_backend/app/api/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
